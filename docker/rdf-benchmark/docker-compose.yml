services:
  jena:
    build:
      context: ./jena-geosparql
      args:
        JENA_VERSION: "${JENA_VERSION:-5.1.0}"
    image: age-spatial-jena-geosparql:${JENA_VERSION:-5.1.0}
    container_name: yago2geo-jena-fuseki
    environment:
      JVM_ARGS: "${JENA_JVM_ARGS:--Xmx96g}"
      JENA_SPATIAL_INDEX: "${JENA_SPATIAL_INDEX:-false}"
    entrypoint:
      - sh
      - -c
      - |
        if [ "$${JENA_SPATIAL_INDEX:-false}" = "true" ]; then
          exec java $${JVM_ARGS:-} -jar /opt/jena/jena-fuseki-geosparql.jar "$$@"
        fi
        exec java $${JVM_ARGS:-} -cp /opt/jena/jena-fuseki-geosparql.jar:/opt/jena/noindex NoSpatialIndexFuseki "$$@"
      - jena
    command:
      - --dataset
      - "${JENA_DATASET:-yago2geo}"
      - --tdb
      - "${JENA_DB_LOC:-/fuseki/databases/yago2geo}"
      - --tdb2
      - --port
      - "3030"
      - --loopback
      - "false"
      - --index
      - "${JENA_INDEX:-false}"
      - --spatial_index
      - "${JENA_SPATIAL_INDEX_FILE:-/fuseki/databases/${JENA_DATASET:-yago2geo}/spatial.index}"
    ports:
      - "${JENA_PORT:-13030}:3030"
    volumes:
      - ../../benchmark/results/rdfdb/jena_data:/fuseki
      - ../../benchmark/data/extracted/yago2geo:/rdf/yago2geo:ro
      - ../../benchmark/results/rdfdb/jena_input:/rdf/yago2geo-jena-input:ro
      - ../../benchmark/results/rdfdb:/rdf/rdfdb:ro
      - ../../benchmark/results/rdfdb/jena_noindex:/opt/jena/noindex:ro
      - ../../benchmark/scripts/rdfdb:/scripts:ro

  jena-loader:
    image: stain/jena:5.1.0
    profiles: ["loader"]
    user: "100:101"
    environment:
      JVM_ARGS: "${JENA_JVM_ARGS:--Xmx96g}"
    volumes:
      - ../../benchmark/results/rdfdb/jena_data:/fuseki
      - ../../benchmark/data/extracted/yago2geo:/rdf/yago2geo:ro
      - ../../benchmark/results/rdfdb/jena_input:/rdf/yago2geo-jena-input:ro
      - ../../benchmark/results/rdfdb:/rdf/rdfdb:ro
      - ../../benchmark/scripts/rdfdb:/scripts:ro
    entrypoint: ["/scripts/load-jena-yago2geo.sh"]

  virtuoso:
    image: openlink/virtuoso-opensource-7:latest
    container_name: yago2geo-virtuoso
    environment:
      DBA_PASSWORD: "${VIRTUOSO_DBA_PASSWORD:-dba}"
      SPARQL_UPDATE: "true"
      DEFAULT_GRAPH: "${YAGO2GEO_GRAPH_IRI:-http://yago-knowledge.org/graph/yago2geo}"
      VIRT_Parameters_NumberOfBuffers: "${VIRTUOSO_NUMBER_OF_BUFFERS:-680000}"
      VIRT_Parameters_MaxDirtyBuffers: "${VIRTUOSO_MAX_DIRTY_BUFFERS:-500000}"
      VIRT_Parameters_MaxQueryMem: "${VIRTUOSO_MAX_QUERY_MEM:-8G}"
      VIRT_Parameters_DirsAllowed: "., ../vad, /usr/share/proj, /database/rdf/yago2geo, /database/rdfdb"
    ports:
      - "${VIRTUOSO_HTTP_PORT:-18890}:8890"
      - "${VIRTUOSO_SQL_PORT:-11111}:1111"
    volumes:
      - ../../benchmark/results/rdfdb/virtuoso_data:/database
      - ../../benchmark/data/extracted/yago2geo:/database/rdf/yago2geo:ro
      - ../../benchmark/results/rdfdb:/database/rdfdb:ro
      - ../../benchmark/scripts/rdfdb:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "ISQL=$$(command -v isql-v || command -v isql); \"$${ISQL}\" 1111 dba \"$${DBA_PASSWORD}\" 'EXEC=SELECT 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 60

  strabon-postgis:
    image: ${STRABON_POSTGIS_IMAGE:-postgis/postgis:16-3.4}
    container_name: yago2geo-strabon-postgis
    environment:
      POSTGRES_DB: "${STRABON_DB:-endpoint}"
      POSTGRES_USER: "${STRABON_USER:-postgres}"
      POSTGRES_PASSWORD: "${STRABON_PASSWORD:-postgres}"
    ports:
      - "${STRABON_POSTGIS_PORT:-15432}:5432"
    volumes:
      - ../../benchmark/results/rdfdb/strabon_postgis_data:/var/lib/postgresql/data
      - ./strabon-postgis/01-init-strabon.sql:/docker-entrypoint-initdb.d/01-init-strabon.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 60

  strabon:
    build:
      context: ./strabon
      args:
        STRABON_REPO: "${STRABON_REPO:-https://github.com/AI-team-UoA/Strabon.git}"
        STRABON_REF: "${STRABON_REF:-main}"
    image: age-spatial-strabon:${STRABON_VERSION:-latest}
    container_name: yago2geo-strabon
    environment:
      CATALINA_OPTS: "${STRABON_CATALINA_OPTS:--Xms2g -Xmx24g}"
    depends_on:
      strabon-postgis:
        condition: service_healthy
    ports:
      - "${STRABON_PORT:-18080}:8080"
    volumes:
      - ../../benchmark/data/extracted/yago2geo:/rdf/yago2geo:ro
      - ../../benchmark/results/rdfdb/jena_input:/rdf/yago2geo-jena-input:ro
      - ../../benchmark/results/rdfdb:/rdf/rdfdb:ro
      - ../../benchmark/scripts/rdfdb:/scripts:ro

  strabon-loader:
    image: age-spatial-strabon:${STRABON_VERSION:-latest}
    profiles: ["loader"]
    environment:
      RDF_ROOT: "${STRABON_RDF_ROOT:-/rdf/yago2geo-jena-input}"
      FALLBACK_RDF_ROOT: "/rdf/yago2geo"
      STRABON_HOST: "strabon-postgis"
      STRABON_PORT: "5432"
      STRABON_DB: "${STRABON_DB:-endpoint}"
      STRABON_USER: "${STRABON_USER:-postgres}"
      STRABON_PASSWORD: "${STRABON_PASSWORD:-postgres}"
      STRABON_MEMORY_MULT: "${STRABON_MEMORY_MULT:-16}"
    depends_on:
      strabon-postgis:
        condition: service_healthy
    volumes:
      - ../../benchmark/data/extracted/yago2geo:/rdf/yago2geo:ro
      - ../../benchmark/results/rdfdb/jena_input:/rdf/yago2geo-jena-input:ro
      - ../../benchmark/results/rdfdb:/rdf/rdfdb:ro
      - ../../benchmark/scripts/rdfdb:/scripts:ro
    entrypoint: ["/scripts/load-strabon-yago2geo.sh"]
